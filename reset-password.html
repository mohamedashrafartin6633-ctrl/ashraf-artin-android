
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تغيير كلمة المرور - أشرف أرتين</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f2eb;
      color: #24352d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 28px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 5px 25px #0001;
    }

    h2 {
      color: #176b50;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      line-height: 1.7;
    }

    .password-wrapper {
      position: relative;
      margin-top: 14px;
    }

    input {
      width: 100%;
      padding: 14px 45px 14px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      direction: rtl;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #176b50;
      font-size: 20px;
      cursor: pointer;
      padding: 5px;
    }

    .save-button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 8px;
      background: #176b50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      line-height: 1.7;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>أشرف أرتين</h2>
    <p class="subtitle">تعيين كلمة مرور جديدة للبرنامج</p>

    <div class="password-wrapper">
      <input
        id="password"
        type="password"
        placeholder="كلمة المرور الجديدة"
        autocomplete="new-password"
      >
      <button
        class="toggle-password"
        type="button"
        onclick="togglePassword('password', this)"
        aria-label="إظهار كلمة المرور"
      >👁️</button>
    </div>

    <div class="password-wrapper">
      <input
        id="confirm"
        type="password"
        placeholder="تأكيد كلمة المرور"
        autocomplete="new-password"
      >
      <button
        class="toggle-password"
        type="button"
        onclick="togglePassword('confirm', this)"
        aria-label="إظهار تأكيد كلمة المرور"
      >👁️</button>
    </div>

    <button id="save" class="save-button" type="button">
      حفظ كلمة المرور
    </button>

    <p id="message"></p>
  </div>

  <script>
    const SUPABASE_URL =
      "https://kdwjobjsxfztisygxmhm.supabase.co";

    const SUPABASE_KEY = "sb_publishable_pXBbiXW6Jo22tadfgLzpeA_PlNREi2E";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);

      if (input.type === "password") {
        input.type = "text";
        button.textContent = "🙈";
        button.setAttribute("aria-label", "إخفاء كلمة المرور");
      } else {
        input.type = "password";
        button.textContent = "👁️";
        button.setAttribute("aria-label", "إظهار كلمة المرور");
      }
    }

    const message = document.getElementById("message");
    const saveButton = document.getElementById("save");

    saveButton.addEventListener("click", async () => {
      const password =
        document.getElementById("password").value;

      const confirm =
        document.getElementById("confirm").value;

      if (password.length < 8) {
        message.textContent =
          "كلمة المرور يجب أن تكون 8 أحرف على الأقل.";
        return;
      }

      if (password !== confirm) {
        message.textContent =
          "كلمتا المرور غير متطابقتين.";
        return;
      }

      saveButton.disabled = true;
      message.textContent = "جارٍ حفظ كلمة المرور...";

      try {
        const hash = new URLSearchParams(
          location.hash.substring(1)
        );

        const access_token = hash.get("access_token");
        const refresh_token = hash.get("refresh_token");

        if (access_token && refresh_token) {
          const { error: sessionError } =
            await client.auth.setSession({
              access_token,
              refresh_token
            });

          if (sessionError) throw sessionError;
        }

        const { error } = await client.auth.updateUser({
          password: password
        });

        if (error) throw error;

        message.textContent =
          "تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.";

        history.replaceState(null, "", location.pathname);

      } catch (error) {
        message.textContent =
          "تعذر تغيير كلمة المرور: " + error.message;
      } finally {
        saveButton.disabled = false;
      }
    });
  </script>
</body>
</html>
