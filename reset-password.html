
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تغيير كلمة المرور - أشرف أرتين</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f2eb;
      color: #24352d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 28px;
      border-radius: 16px;
      width: 85%;
      max-width: 380px;
      box-shadow: 0 5px 25px #0001;
    }
    h2 { color: #176b50; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #176b50;
      color: white;
      cursor: pointer;
    }
    #message { line-height: 1.7; }
  </style>
</head>
<body>
  <div class="box">
    <h2>أشرف أرتين</h2>
    <p>تعيين كلمة مرور جديدة للبرنامج</p>

    <input id="password" type="password"
      placeholder="كلمة المرور الجديدة" autocomplete="new-password">

    <input id="confirm" type="password"
      placeholder="تأكيد كلمة المرور" autocomplete="new-password">

    <button id="save">حفظ كلمة المرور</button>
    <p id="message"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://kdwjobjsxfztisygxmhm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pXBbiXW6Jo22tadfgLzpeA_PlNREi2E";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");

    document.getElementById("save").onclick = async () => {
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password.length < 8) {
        message.textContent = "كلمة المرور يجب أن تكون 8 أحرف على الأقل.";
        return;
      }

      if (password !== confirm) {
        message.textContent = "كلمتا المرور غير متطابقتين.";
        return;
      }

      const button = document.getElementById("save");
      button.disabled = true;
      message.textContent = "جارٍ حفظ كلمة المرور...";

      try {
        const hash = new URLSearchParams(
          location.hash.substring(1)
        );

        const access_token = hash.get("access_token");
        const refresh_token = hash.get("refresh_token");

        if (access_token && refresh_token) {
          const { error: sessionError } =
            await client.auth.setSession({
              access_token,
              refresh_token
            });

          if (sessionError) throw sessionError;
        }

        const { error } = await client.auth.updateUser({
          password
        });

        if (error) throw error;

        message.textContent =
          "تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.";
        history.replaceState(null, "", location.pathname);
      } catch (error) {
        message.textContent =
          "تعذر تغيير كلمة المرور: " + error.message;
      } finally {
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
