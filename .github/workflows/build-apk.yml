name: Build Ashraf Artin V6 Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    name: Build V6 Signed Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V6 Release Project
        run: |
          test -f Ashraf-Artin-V6-Source.zip
          mkdir -p native_project
          unzip -o Ashraf-Artin-V6-Source.zip -d native_project

      - name: Verify Android Project
        run: |
          test -f native_project/settings.gradle
          test -f native_project/build.gradle
          test -f native_project/app/build.gradle
          test -f native_project/app/src/main/AndroidManifest.xml
          test -f native_project/app/src/main/java/com/ashrafartin/nativeapp/MainActivity.kt

      - name: Restore Release Signing Key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"

          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
          } > native_project/local.properties

      - name: Build Signed Release APK
        run: |
          gradle -p native_project assembleRelease

      - name: Verify APK
        run: |
          APK="native_project/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashraf-Artin-V6-Signed-Release-APK
          path: native_project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove Temporary Signing Key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
        
