
name: Build Ashraf Artin Native APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract New Native Android Project
        run: |
          test -f "ashraf_artin_supabase_configured.zip"
          mkdir -p native_project
          unzip -o "ashraf_artin_supabase_configured.zip" -d native_project

      - name: Verify Android Project
        run: |
          test -f native_project/aa_work/settings.gradle
          test -f native_project/aa_work/app/build.gradle
          test -f native_project/aa_work/app/src/main/AndroidManifest.xml
          test -f native_project/aa_work/app/src/main/java/com/ashrafartin/nativeapp/MainActivity.kt

      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
          } > native_project/aa_work/local.properties

      - name: Build Native APK
        run: gradle -p native_project/aa_work assembleDebug

      - name: Verify APK
        run: |
          test -f native_project/aa_work/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashraf-Artin-Native-APK
          path: native_project/aa_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
