
name: Build Ashraf Artin Native APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Native Project
        run: |
          mkdir -p native_project
          unzip -o ashraf_artin_native_android_project.zip -d native_project

      - name: Verify Project
        run: |
          test -f native_project/settings.gradle
          test -f native_project/app/build.gradle
          test -f native_project/app/src/main/AndroidManifest.xml

      - name: Create Supabase Configuration
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" > native_project/local.properties

      - name: Build Native APK
        run: gradle -p native_project assembleDebug

      - name: Upload Native APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashraf-Artin-Native-APK
          path: native_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
